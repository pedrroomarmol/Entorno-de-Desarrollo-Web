{% load static %}
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Escaparate</title>
        <link rel="stylesheet" href="{% static 'css/style.css' %}">
    </head>
    <body>
        <header class="site-header">
            <a class="site-title" href="{% url 'home' %}">Mi sitio</a>
            <nav aria-label="Navegación principal">
                <a href="{% url 'home' %}">Inicio</a>
                <a href="{% url 'escaparate:home' %}" aria-current="page">Escaparate</a>
            </nav>
        </header>
        <main class="page-content">
            <h1>Escaparate</h1>
            <p>Una selección de imágenes.</p>
            <section class="gallery" aria-label="Galería de imágenes">
                <figure>
                    <img src="{% static 'images/Imagen1.png' %}" alt="Primera imagen">
                    <figcaption>Imagen 1</figcaption>
                </figure>
                <figure>
                    <img src="{% static 'images/Imagen2.jpg' %}" alt="Segunda imagen">
                    <figcaption>Imagen 2</figcaption>
                </figure>
            </section>
        </main>
    </body>
</html>
