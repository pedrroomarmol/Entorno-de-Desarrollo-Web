{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tienda de bolígrafos{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/tienda_bolis.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="site-title" href="{% url 'home' %}">Tienda de bolis</a>
        <nav aria-label="Navegación principal">
            <a href="{% url 'home' %}">Inicio</a>
            <a href="{% url 'tienda_bolis:home' %}">Tienda</a>
            <a href="{% url 'tienda_bolis:contact' %}">Contacto</a>
        </nav>
    </header>
    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p>&copy; Tienda de bolis</p>
    </footer>
</body>
</html>
